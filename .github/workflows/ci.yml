name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install --upgrade pip uv
      - name: Install dependencies
        run: |
          uv venv --python 3.11
          uv pip install -e ".[dev]" --python .venv/bin/python
      - name: Run tests
        run: uv run --python .venv/bin/python pytest tests/test_benchmark_instances.py tests/test_metachain_tool_calls.py
